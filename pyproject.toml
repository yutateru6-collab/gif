[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combat-sprite-generator"
version = "0.1.0"
description = "Generate 16-frame pixel-art combat sprites and GIFs from a single image using Gemini image generation."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "OpenAI Ghostwriter"}
]
dependencies = [
  "Pillow>=10.0.0",
  "google-genai>=1.0.0",
  "streamlit>=1.30.0"
]

[project.scripts]
combat-sprite-generator = "combat_sprite_generator.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["combat_sprite_generator*"]
